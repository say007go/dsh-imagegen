<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-imagegen 配置表单截图工装</title>
<style>
  body { margin: 0; padding: 26px; background: #f3f4f6; color: #1f2328;
         font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .shell { max-width: 1020px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 10px; margin: 4px 2px 10px; }
  .head h1 { font-size: 17px; margin: 0; font-weight: 600; color: #1f2328; }
  .head .pill { font-size: 11px; color: #1a7f37; margin-left: auto; }
  .card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 6px 22px 2px;
          box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
  .foot { font-size: 11px; color: #667085; opacity: .7; margin: 10px 2px 0; }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <h1>dsh-imagegen</h1><span class="pill">● 运行中</span>
  </div>
  <div class="card"><div id="root"></div></div>
  <div class="foot">插件详情页 · 配置表单（由仓库 lib/client.js 真实组件渲染）</div>
</div>

<!-- 真实生产组件（与线上同源） -->
<script>
  window.__ModuleLoader__ = { load(def) { window.__captured = def; } };
</script>
<script src="../lib/client.js"></script>
<script>
  // —— 极简 React DOM shim：把 client.js 的 jsx 直接渲染为真实 DOM ——
  const React = { useState: (i) => [i, () => {}], useEffect: () => {}, useSyncExternalStore: (s, g) => g() };
  const JSX = { jsx: (t, p) => ({ __j: 1, t, p }), jsxs: (t, p) => ({ __j: 1, t, p }) };

  function applyProps(node, props) {
    for (const [k, v] of Object.entries(props || {})) {
      if (k === "children" || v === false || v === null || v === undefined) continue;
      if (k === "style") { Object.assign(node.style, v); continue; }
      if (k === "value") { node.value = v; node.setAttribute("value", v); continue; }
      if (k === "checked") { node.checked = !!v; if (v) node.setAttribute("checked", ""); continue; }
      if (k === "disabled") { if (v) node.disabled = true; continue; }
      node.setAttribute(k, v);
    }
  }

  function render(node) {
    if (node === null || node === undefined || node === false) return document.createTextNode("");
    if (typeof node === "string" || typeof node === "number") return document.createTextNode(String(node));
    if (Array.isArray(node)) {
      const frag = document.createDocumentFragment();
      node.forEach((c) => frag.appendChild(render(c)));
      return frag;
    }
    if (node.__j) {
      const { t, p } = node;
      if (typeof t === "function") return render(t(p || {})); // 函数组件直接调用
      const el = document.createElement(t);
      el.appendChild(render(p && p.children));
      applyProps(el, p);
      return el;
    }
    return document.createTextNode("");
  }

  // —— 服务桩：快照值取真实配置形态 ——
  let CARD = null;
  const value = {
    provider: { baseUrl: "https://duomiapi.com/v1", model: "gpt-image-2.5-flare", defaultSize: "3840x2160" },
    cos: { enabled: true, region: "ap-guangzhou", bucket: "imagegen-1250000000" },
    promptEnhance: { enabled: true, suffix: "所有中文内容必须印刷级清晰，笔画完整无残缺。禁止出现乱码、模糊、变形、粘连、错别字。" },
  };
  const form = { subscribe: () => () => {}, getSnapshot: () => ({ value, revision: 1, writable: true }), mutate: () => Promise.resolve(true) };
  const ctx = {
    effect: (f) => { const d = f(); if (typeof d === "function") d(); },
    slots: { inject: (n, f) => f(), register: (r, c) => (CARD = c, () => {}) },
    configForms: {
      whileServed: (ns, f) => f(new Set(ns)),
      get: () => form,
      describe: () => ({ getSnapshot: () => ({ view: { namespaces: [{ ns: "imagegen", writable: true, secrets: [
        { path: ["provider", "apiKey"], set: true },
        { path: ["cos", "secretId"], set: true },
        { path: ["cos", "secretKey"], set: false },
      ] }] } }) }),
    },
  };

  const mod = window.__captured.factory((id) =>
    id === "react" ? React : id === "react/jsx-runtime" ? JSX : (() => { throw new Error("unexpected: " + id); })());
  mod.apply(ctx);
  document.getElementById("root").appendChild(render(CARD({})));
</script>
</body>
</html>
